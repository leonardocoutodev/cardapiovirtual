<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071019">
  <title>Talvi — Painel do Proprietário</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{position:fixed;inset:0;background:#071019}.frame{width:100%;height:100%;border:0;display:block;background:#071019}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#071019;color:#b8c8d4;z-index:2;transition:opacity .2s ease}.loading.hidden{opacity:0;pointer-events:none}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#67e0ae;color:#0c241b;font-size:20px;font-weight:950;margin:0 auto 14px}.loading strong{display:block;color:#fff;text-align:center;font-size:15px}.loading small{display:block;margin-top:5px;color:#74899a;text-align:center;font-size:10px}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading" id="loading"><div><span class="mark">T</span><strong>Abrindo Talvi</strong><small>Painel do Proprietário</small></div></div>
    <iframe id="legacy" class="frame" src="/menu-pro-owner.html?brand=talvi" title="Talvi — Painel do Proprietário" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
  (()=>{
    'use strict';
    const frame=document.getElementById('legacy');
    const loading=document.getElementById('loading');
    const replacements=[
      [/LC Menu Pro/g,'Talvi'],
      [/Menu Pro/g,'Talvi'],
      [/menu pro/gi,'Talvi']
    ];
    const replaceText=value=>{
      let next=String(value||'');
      for(const [pattern,replacement] of replacements)next=next.replace(pattern,replacement);
      return next;
    };
    function patchDocument(doc){
      if(!doc)return;
      try{doc.title='Talvi — Painel do Proprietário';}catch(_){ }
      const walker=doc.createTreeWalker(doc.documentElement,NodeFilter.SHOW_TEXT);
      const nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      for(const node of nodes){
        const next=replaceText(node.nodeValue);
        if(next!==node.nodeValue)node.nodeValue=next;
      }
      doc.querySelectorAll('[title],[aria-label],[alt],[placeholder]').forEach(el=>{
        ['title','aria-label','alt','placeholder'].forEach(attr=>{
          if(!el.hasAttribute(attr))return;
          const value=el.getAttribute(attr);
          const next=replaceText(value);
          if(next!==value)el.setAttribute(attr,next);
        });
      });
      if(!doc.getElementById('talvi-brand-bridge')){
        const style=doc.createElement('style');
        style.id='talvi-brand-bridge';
        style.textContent='body{--talvi-brand:#67e0ae}.side-brand b,.auth-brand h1{letter-spacing:-.035em}.side-brand small{letter-spacing:.08em}';
        doc.head.appendChild(style);
      }
    }
    function attachObserver(doc){
      const observer=new MutationObserver(mutations=>{
        let needsPatch=false;
        for(const mutation of mutations){
          if(mutation.type==='characterData'||mutation.addedNodes.length){needsPatch=true;break;}
        }
        if(needsPatch)patchDocument(doc);
      });
      observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});
      return observer;
    }
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        patchDocument(doc);
        attachObserver(doc);
        loading.classList.add('hidden');
        setTimeout(()=>loading.remove(),260);
      }catch(e){
        loading.querySelector('small').textContent='Não foi possível carregar o painel agora.';
      }
    });
  })();
  </script>
</body>
</html>
